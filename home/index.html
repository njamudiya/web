<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 8000);
camera.position.set(0, 120, 500);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const sun = new THREE.PointLight(0xffffff, 2.5, 0);
sun.position.set(600, 300, 600);
scene.add(sun);

scene.add(new THREE.AmbientLight(0x222222));

const starGeo = new THREE.BufferGeometry();
const starCount = 40000;
const starPos = new Float32Array(starCount*3);

for(let i=0;i<starCount;i++){
  starPos[i*3]=(Math.random()-0.5)*8000;
  starPos[i*3+1]=(Math.random()-0.5)*8000;
  starPos[i*3+2]=(Math.random()-0.5)*8000;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));

const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff,size:1}));
scene.add(stars);

const loader = new THREE.TextureLoader();

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(100,128,128),
  new THREE.MeshPhongMaterial({
    map: loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),
    specularMap: loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg'),
    emissiveMap: loader.load('https://threejs.org/examples/textures/planets/earth_lights_2048.png'),
    emissive: new THREE.Color(0xffffff),
    emissiveIntensity: 0.6,
    specular: new THREE.Color('grey')
  })
);
scene.add(earth);

const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(102,128,128),
  new THREE.MeshPhongMaterial({
    map: loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'),
    transparent:true,
    opacity:0.8
  })
);
scene.add(clouds);

const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(108,128,128),
  new THREE.MeshBasicMaterial({
    color:0x00aaff,
    transparent:true,
    opacity:0.08,
    side:THREE.BackSide
  })
);
scene.add(atmosphere);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(30,64,64),
  new THREE.MeshPhongMaterial({
    map: loader.load('https://threejs.org/examples/textures/planets/moon_1024.jpg')
  })
);
scene.add(moon);

let dragging=false;
let prev={x:0,y:0};

window.addEventListener('mousedown',e=>{dragging=true;prev.x=e.clientX;prev.y=e.clientY;});
window.addEventListener('mouseup',()=>dragging=false);

window.addEventListener('mousemove',e=>{
  if(dragging){
    const dx=e.clientX-prev.x;
    const dy=e.clientY-prev.y;
    earth.rotation.y+=dx*0.004;
    earth.rotation.x+=dy*0.004;
    prev.x=e.clientX;
    prev.y=e.clientY;
  }
});

window.addEventListener('wheel',e=>{
  camera.position.z+=e.deltaY*0.25;
  camera.position.z=Math.max(220,Math.min(1500,camera.position.z));
});

function animate(){
  requestAnimationFrame(animate);

  const p=starGeo.attributes.position.array;
  for(let i=0;i<p.length;i+=3){
    p[i+2]+=4;
    if(p[i+2]>3000) p[i+2]=-3000;
  }
  starGeo.attributes.position.needsUpdate=true;

  earth.rotation.y+=0.0012;
  clouds.rotation.y+=0.0018;

  const t=Date.now()*0.001;
  moon.position.x=Math.cos(t*0.25)*320;
  moon.position.z=Math.sin(t*0.25)*320;

  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}
animate();

console.assert(earth.material.emissiveMap !== undefined);
console.assert(starGeo.attributes.position.count === 40000);
console.assert(typeof animate === 'function');

</script>

</body>
</html>
